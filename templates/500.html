{% extends "base.html" %}
{% block titulo %}Error interno{% endblock %}
{% block contenido %}
<div class="text-center py-5">
  <div class="display-1 fw-bold text-danger">500</div>
  <h1 class="h3">Algo salió mal</h1>
  <p class="text-muted">Ocurrió un error inesperado. Tus datos guardados no se perdieron; el detalle quedó registrado en
    <code>logs/errores.log</code>.</p>
  <div class="d-flex justify-content-center gap-2">
    <a class="btn btn-primary" href="{{ url_for('inicio') }}"><i class="bi bi-house"></i> Volver al inicio</a>
    <a class="btn btn-outline-secondary" href="javascript:history.back()">Regresar</a>
  </div>
</div>
{% endblock %}
